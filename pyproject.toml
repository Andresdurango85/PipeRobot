[project]
name = "so101-policy-ci"
version = "0.1.0"
description = "CI quality gate for robot policies: evaluate an SO-101 policy in simulation on every PR and block regressions."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# Heavy: pulls torch + torchvision. Not installed in the lint/test CI job.
lerobot = ["lerobot[dataset]==0.6.1"]

[dependency-groups]
dev = [
    "pre-commit>=4.7",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.uv]
package = false
# Security: LeRobot 0.6.1 caps Pillow<13, but 13.0.0 fixes 41 advisories (5 critical). See ADR 0012.
override-dependencies = ["pillow>=13.0.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM",
    "PT",  # pytest style
    "ANN", # type annotations required
    "RUF",
    "S",   # flake8-bandit: insecure patterns (security)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "-m", "not hub"]
markers = [
    "hub: needs network access to the Hugging Face Hub and the `lerobot` extra (run with -m hub)",
]

[tool.ruff.lint.per-file-ignores]
# Tests: plain asserts are the point (S101); seeded `random` drives Monte Carlo checks, not crypto (S311).
"tests/**" = ["S101", "S311"]
