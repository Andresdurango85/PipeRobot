[project]
name = "piperobot"
version = "0.1.0"
description = "CI quality gate for robot policies: evaluate a policy in simulation on every PR and block regressions."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# Heavy: pulls torch + torchvision. Not installed in the lint/test CI job. torch and torchvision
# are listed directly so that `tool.uv.sources` can pick their index (ADR 0017).
lerobot = ["lerobot[dataset]>=0.6.1,<0.7", "torch>=2.11,<2.12", "torchvision>=0.26,<0.27"]

[build-system]
requires = ["uv_build>=0.10.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "piperobot"

[dependency-groups]
# Real evaluation in the PushT 2D simulator (CPU only). Not published (ADR 0019).
sim-pusht = ["lerobot[dataset,evaluation,pusht]>=0.6.1,<0.7"]
# Real SO-101 arm: Feetech motors, keyboard/serial, Rerun, ACT training. Not published (ADR 0022).
so101 = ["lerobot[feetech,hardware,viz,training]>=0.6.1,<0.7"]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "prek>=0.5",
    "pytest>=8.4",
    "pyyaml>=6.0",
    "ruff>=0.14",
    "types-pyyaml>=6.0",
    "zizmor>=1.32",
]
# Coverage-guided parser fuzzing: Linux x86_64 wheels only, run by fuzz.yml.
fuzz = ["atheris>=3.1.0; sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Mutation testing of piperobot/stats. mutmut 3 needs fork(): Linux only, run by mutation.yml.
mutation = ["mutmut>=3.8.1"]
# SO-101 cache preparation: the course dataset's parquet episodes, without torch (prepare_caches.py).
so101-data = [
    "huggingface-hub>=1.33,<2",
    "pyarrow>=26,<27",
]

[tool.uv]
# Security: LeRobot 0.6.1 caps Pillow<13, but 13.0.0 fixes 41 advisories (5 critical). See ADR 0012.
override-dependencies = ["pillow>=13.0.0"]

# CPU-only torch on Linux (CI runners): PyPI's Linux wheels bundle CUDA, several GB. Windows and
# macOS keep PyPI, whose wheels are already CPU-only. ADR 0017.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM",
    "PT",  # pytest style
    "ANN", # type annotations required
    "RUF",
    "S",   # flake8-bandit: insecure patterns (security)
]

[tool.mypy]
# ADR 0025: check the package, tests and CI scripts strictly; robots/ is not checked yet.
files = ["piperobot", "tests", ".github/scripts", "fuzz", ".claude/skills"]
# These tests exercise robots/so101 code, which is not type-checked yet;
# they join with robots/ later.
exclude = '^tests/(test_so101_.*\.py|so101_loader\.py|test_dataset_stats\.py)$'
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# Lazy imports in piperobot/adapters/lerobot/policy.py come only with the lerobot extra,
# absent from lint-and-test. The hub tests exercise the real API (ADR 0025).
module = ["lerobot", "lerobot.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# These test dependencies come only with the lerobot extra, absent from lint-and-test.
module = ["PIL", "PIL.*", "numpy", "numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Atheris is installed only on Linux x86_64 fuzz runners.
module = ["atheris"]
ignore_missing_imports = true

# Linux mutation reporting: .github/workflows/mutation.yml.
[tool.mutmut]
source_paths = ["piperobot"]
only_mutate = ["piperobot/stats/*"]
also_copy = ["robots"]
# Every test file that imports piperobot.stats, or its mutants report "no tests"
# (tests/test_mutation_config.py checks this list and mutation.yml's paths).
pytest_add_cli_args_test_selection = [
    "tests/test_certificate.py",
    "tests/test_gate.py",
    "tests/test_gate_inputs.py",
    "tests/test_history.py",
    "tests/test_manual_eval.py",
    "tests/test_mock_eval.py",
    "tests/test_paired.py",
    "tests/test_paired_comment.py",
    "tests/test_pr_comment.py",
    "tests/test_stats_properties.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not hub and not github"]
markers = [
    "github: live certificate verification against GitHub Pages (run with -m github)",
    "hub: needs network access to the Hugging Face Hub and the `lerobot` extra (run with -m hub)",
]

[tool.ruff.lint.per-file-ignores]
# Tests: plain asserts are the point (S101); seeded `random` drives Monte Carlo checks, not crypto (S311).
"tests/**" = ["S101", "S311"]
