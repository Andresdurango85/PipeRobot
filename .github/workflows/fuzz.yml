name: fuzz

on:
  pull_request:
    paths:
      - 'piperobot/**'
      - 'fuzz/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions: {}

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [results, history, history_record, bundle, task_spec, video_manifest, history_fields]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group fuzz
      - name: Fuzz parser
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_LIMIT: ${{ github.event_name == 'pull_request' && '60' || '600' }}
        run: |
          mkdir -p "work/fuzz/$TARGET" "work/crashes/$TARGET"
          uv run --no-sync python "fuzz/fuzz_$TARGET.py" "work/fuzz/$TARGET" "fuzz/corpus/$TARGET" -max_total_time="$SECONDS_LIMIT" -timeout=10 -rss_limit_mb=2048 -artifact_prefix="work/crashes/$TARGET/"
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ matrix.target }}-${{ github.run_attempt }}
          path: work/crashes/${{ matrix.target }}/
          retention-days: 7
