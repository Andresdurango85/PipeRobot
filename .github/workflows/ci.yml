name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    # Plain GitHub-hosted runner: no GPU, no LeRobot/torch. The GPU gate will be pr-gate.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install dev dependencies (from uv.lock)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel

      - name: Check wheel contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel, = Path("dist").glob("*.whl")
          metadata = wheel.stem.rsplit("-", 3)[0] + ".dist-info"
          with ZipFile(wheel) as archive:
              unexpected = [
                  name for name in archive.namelist()
                  if name.split("/", 1)[0] not in {"piperobot", metadata}
              ]
          if unexpected:
              raise SystemExit(f"Unexpected wheel contents: {unexpected}")
          PY

      - name: Install without extras or dev dependencies
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/piperobot-clean"
          uv pip install --python "$RUNNER_TEMP/piperobot-clean/bin/python" --no-deps dist/*.whl

      - name: Import every installed module outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/piperobot-clean/bin/python" -I - <<'PY'
          import importlib
          import pkgutil
          import piperobot

          for module in pkgutil.walk_packages(piperobot.__path__, prefix="piperobot."):
              importlib.import_module(module.name)
          PY
