name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    # Plain GitHub-hosted runner: no GPU, no LeRobot/torch. The GPU gate will be pr-gate.yml.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04] # PROBE (DO NOT MERGE): compare images side by side
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dev dependencies (from uv.lock)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Probe the image
        run: |
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          echo "ImageVersion: ${ImageVersion:-unknown}"
          uname -r
          for b in pwsh powershell python3 git; do
            if command -v "$b" >/dev/null; then echo "$b: $(command -v "$b") $("$b" --version 2>&1 | head -1)"; else echo "$b: MISSING"; fi
          done
          uv run python -c "import platform, sys; print(sys.version); print(platform.libc_ver())"

      - name: Pytest
        run: uv run pytest -rs

  clean-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04] # PROBE (DO NOT MERGE): compare images side by side
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel

      - name: Check wheel contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel, = Path("dist").glob("*.whl")
          metadata = wheel.stem.rsplit("-", 3)[0] + ".dist-info"
          with ZipFile(wheel) as archive:
              unexpected = [
                  name for name in archive.namelist()
                  if name.split("/", 1)[0] not in {"piperobot", metadata}
              ]
          if unexpected:
              raise SystemExit(f"Unexpected wheel contents: {unexpected}")
          PY

      - name: Install without extras or dev dependencies
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/piperobot-clean"
          uv pip install --python "$RUNNER_TEMP/piperobot-clean/bin/python" --no-deps dist/*.whl

      - name: Import every installed module outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/piperobot-clean/bin/python" -I - <<'PY'
          import importlib
          import pkgutil
          import piperobot

          for module in pkgutil.walk_packages(piperobot.__path__, prefix="piperobot."):
              importlib.import_module(module.name)
          PY

  type-check:
    # mypy --strict on the piperobot package, without the lerobot extra (ADR 0025).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04] # PROBE (DO NOT MERGE): compare images side by side
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dev dependencies (from uv.lock)
        run: uv sync --locked

      - name: Mypy
        run: uv run mypy
