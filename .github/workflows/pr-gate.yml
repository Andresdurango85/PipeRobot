name: pr-gate

# Evaluate the policy, compare it with the stored baseline, post the sticky PR comment, and fail
# on a regression (ADR 0014). The evaluator is the real PushT policy on CPU (ADR 0016, ADR 0017);
# Isaac Lab-Arena replaces it later, on the self-hosted GPU runner (ADR 0005).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Phase 0 budget per PR
    permissions:
      contents: read
      pull-requests: write # sticky comment only
    env:
      RESULTS: out/results.json
      COMMENT: out/comment.md
      POLICY: robots/pusht/policies/vqbet.json
      BASELINE: robots/pusht/baselines/vqbet.json
      WORK_DIR: work/lerobot # outside out/, so the cached policy is not uploaded
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies (from uv.lock, CPU-only torch)
        run: uv sync --locked --extra lerobot --group sim-pusht

      - name: Record the runner's CPU
        # Same seeds give the same episodes only on the same platform (ADR 0016).
        run: |
          echo "Runner: $(uv run python -m piperobot.platform_info)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache the prepared policy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WORK_DIR }}/policies
          key: policy-${{ hashFiles('robots/pusht/policies/vqbet.json', 'uv.lock', 'piperobot/adapters/lerobot/policy.py') }}

      - name: Evaluate policy (PushT, 50 fixed-seed episodes on CPU)
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run python -m piperobot.adapters.lerobot.evaluate --policy "$POLICY" --work-dir "$WORK_DIR" \
            --output "$RESULTS" --videos-link "$RUN_URL#artifacts"
          cp -r "$WORK_DIR/eval/videos" out/

      - name: Render report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run python -m piperobot.reports.pr_comment --results "$RESULTS" \
            --baseline-file "$BASELINE" --run-url "$RUN_URL" --commit "$HEAD_SHA" \
            --output "$COMMENT"
          cat "$COMMENT" >> "$GITHUB_STEP_SUMMARY"

      - name: Post sticky PR comment
        # Fork PRs get a read-only token: the report stays in the job summary instead.
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: uv run python -m piperobot.reports.sticky_comment --pr "$PR_NUMBER" --body-file "$COMMENT"

      - name: Gate verdict (fails the job on BLOCK)
        run: uv run python -m piperobot.stats.gate --results "$RESULTS" --baseline-file "$BASELINE"

      - name: Upload results and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-gate-${{ github.event.pull_request.number }}
          path: out/
          retention-days: 14
