          uv run python -m piperobot.adapters.lerobot.evaluate --policy "$POLICY" \
            --work-dir work/native --episodes "$EPISODES" --seed "$SEED" --output out/native.json
          {
            echo "arm=native-2404"
            echo "image=$ImageOS $ImageVersion"
            echo "cpu_model=$(grep -m 1 '^model name[[:space:]]*:' /proc/cpuinfo | cut -d: -f2-)"
            echo "cpu_flags_sha256=$(sha256sum out/cpu_flags.txt | cut -d ' ' -f1)"
            echo "glibc=$(ldd --version | head -n 1)"
            echo "python=$(uv run python -VV)"
            echo "platform=$(uv run python -m piperobot.platform_info)"
            echo "wall_seconds=$((SECONDS - start))"
