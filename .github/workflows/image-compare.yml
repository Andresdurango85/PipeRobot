          uv run --no-sync python -m piperobot.stats.paired --alpha 0.025 \
            --reference robots/pusht/baselines/vqbet-episodes.json --candidate out/native.json \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-2404-${{ matrix.replica }}
          path: out/
          retention-days: 30

