name: nightly

# Rotate fresh seeds to detect overfitting to pr-gate's fixed seed set.
# Compare reference and candidate on identical seeds for paired statistical power.
# Run both arms sequentially in one hosted job: CPU model labels cannot predict flips.
# Keep each commit's lockfile and upload only evaluation evidence for later certification.
# ADR 0031: a BLOCK is an alert to investigate on the next nights, never a merge block.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      episodes:
        description: Number of episodes (1-1000)
        default: "500"
      first_seed:
        description: First seed (empty uses today's rotating range)
        default: ""
  # TEMPORARY: measurement run before merge, remove
  push:
    branches: [feat/nightly-paired]

permissions: {}
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      # Bootstrap without caching; the reference lockfile is not available yet.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Plan reference and seeds
        id: plan
        working-directory: candidate
        env:
          EPISODES: ${{ inputs.episodes }}
          FIRST_SEED: ${{ inputs.first_seed }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from pathlib import Path
          commit = json.loads(Path('robots/pusht/baselines/vqbet.json').read_text())['commit']
          if not isinstance(commit, str) or not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('reference commit must be 40 lowercase hex characters')
          print(f'commit={commit}')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write(f'Reference commit: {commit}\n')
          PY
          uv run --no-project python -m piperobot.seeds >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.plan.outputs.commit }}
          path: reference
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            candidate/uv.lock
            reference/uv.lock
      - name: Evaluate reference then candidate on the same runner
        env:
          EPISODES: ${{ steps.plan.outputs.episodes }}
          SEED: ${{ steps.plan.outputs.seed }}
          REFERENCE_COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          mkdir -p "$OUT"
          printf '%s\n' "$REFERENCE_COMMIT" > "$OUT/reference_commit.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/candidate_commit.txt"
          grep -m 1 '^flags[[:space:]]*:' /proc/cpuinfo > "$OUT/cpu_flags.txt"
          cd reference
          uv sync --locked --extra lerobot --group sim-pusht
          date -u +%Y-%m-%dT%H:%M:%SZ > "$OUT/evaluated_at.txt"
          start=$SECONDS
          uv run python -m piperobot.adapters.lerobot.evaluate \
            --policy robots/pusht/policies/vqbet.json --episodes "$EPISODES" --seed "$SEED" \
            --work-dir work/lerobot --output "$OUT/reference.json"
          echo "Reference wall time: $((SECONDS - start)) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
          cd ../candidate
          uv sync --locked --extra lerobot --group sim-pusht
          uv run python -m piperobot.platform_info > "$OUT/platform.txt"
          start=$SECONDS
          uv run python -m piperobot.adapters.lerobot.evaluate \
            --policy robots/pusht/policies/vqbet.json --episodes "$EPISODES" --seed "$SEED" \
            --work-dir work/lerobot --output "$OUT/candidate.json"
          echo "Candidate wall time: $((SECONDS - start)) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-evaluation
          path: |
            out/reference.json
            out/candidate.json
            out/reference_commit.txt
            out/candidate_commit.txt
            out/platform.txt
            out/evaluated_at.txt
            out/cpu_flags.txt
          retention-days: 30
          if-no-files-found: error

  verdict:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-evaluation
          path: out/
      - name: Paired alert and informational baseline comparison
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          seeds = [e['seed'] for e in json.loads(Path('out/candidate.json').read_text())['episodes']]
          commit = Path('out/reference_commit.txt').read_text().strip()
          platform = Path('out/platform.txt').read_text().strip()
          print(f"## Paired nightly: seeds {min(seeds)}-{max(seeds)}, reference {commit}, platform {platform}")
          PY
          paired_exit=0
          uv run python -m piperobot.stats.paired --reference out/reference.json \
            --candidate out/candidate.json > paired.txt 2>&1 || paired_exit=$?
          cat paired.txt | tee -a "$GITHUB_STEP_SUMMARY"
          echo '## Unpaired comparison with committed counts (informational only)' >> "$GITHUB_STEP_SUMMARY"
          uv run python -m piperobot.stats.gate --results out/candidate.json \
            --baseline-file robots/pusht/baselines/vqbet.json > unpaired.txt 2>&1 || true
          cat unpaired.txt | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$paired_exit" -eq 1 ]; then
            echo "::error::A nightly BLOCK is an alert to investigate on the next nights' fresh seeds, not a merge block."
            exit 1
          fi
          exit "$paired_exit"
