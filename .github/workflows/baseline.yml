name: baseline

# Measure a policy's baseline on the same GitHub-hosted runner type that pr-gate uses, because
# same seeds give the same episodes only on the same platform (ADR 0016, ADR 0017). Run it by
# hand, then commit the counts from the artifact to robots/<robot>/baselines/ in a PR.
on:
  workflow_dispatch:
    inputs:
      episodes:
        description: Number of episodes
        default: "500"
      seed:
        description: First episode seed (pr-gate uses 1000)
        default: "1000"

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      POLICY: robots/pusht/policies/vqbet.json
      BASELINE: robots/pusht/baselines/vqbet.json
      WORK_DIR: work/lerobot
      EPISODES: ${{ inputs.episodes }}
      SEED: ${{ inputs.seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies (from uv.lock, CPU-only torch)
        run: uv sync --locked --extra lerobot --group sim-pusht

      - name: Record the runner's CPU
        run: |
          echo "Runner: $(uv run python -m piperobot.platform_info)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache the prepared policy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WORK_DIR }}/policies
          key: policy-${{ hashFiles('robots/pusht/policies/vqbet.json', 'uv.lock', 'piperobot/adapters/lerobot/policy.py') }}

      - name: Evaluate policy
        run: |
          uv run python -m piperobot.adapters.lerobot.evaluate --policy "$POLICY" --work-dir "$WORK_DIR" \
            --episodes "$EPISODES" --seed "$SEED" --output out/results.json

      - name: Compare with the committed baseline
        # Informational: a new baseline should agree with the old one; the verdict does not fail.
        run: |
          uv run python -m piperobot.stats.gate --results out/results.json --baseline-file "$BASELINE" \
            | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-${{ github.run_id }}
          path: out/
          retention-days: 30
