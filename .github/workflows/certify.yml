name: certify

# The only signer of v2 certificates (ADR 0031). Callers use the relative path only:
# uses: $/.github/workflows/certify.yml, so this runs at the caller's own commit.
on:
  workflow_call:
    inputs:
      series:
        type: string
        required: true
      artifact:
        type: string
        required: true
permissions: {}

jobs:
  attest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      BASELINE: robots/pusht/baselines/vqbet.json
      SERIES: ${{ inputs.series }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --no-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: out/
      - name: Write the record
        id: record
        run: |
          case "$SERIES" in
            main)
              results=out/results.json
              extra=()
              evidence=()
              subjects=(out/results.json)
              ;;
            nightly)
              results=out/candidate.json
              extra=(--paired-reference out/reference.json)
              evidence=(out/reference_commit.txt)
              subjects=(out/candidate.json out/reference.json)
              if [[ -f out/candidate_commit.txt && "$(cat out/candidate_commit.txt)" != "$GITHUB_SHA" ]]; then
                echo "ERROR: candidate_commit.txt differs from GITHUB_SHA" >&2
                exit 2
              fi
              ;;
            *) echo "ERROR: series must be main or nightly" >&2; exit 2 ;;
          esac
          for file in "${subjects[@]}" "${evidence[@]}" out/platform.txt out/evaluated_at.txt out/cpu_flags.txt out/runner_image.txt; do
            if [[ ! -s "$file" ]]; then
              echo "ERROR: missing or empty evidence file: $file" >&2
              exit 2
            fi
          done
          if [[ "$SERIES" == nightly ]]; then
            extra+=(--reference-commit "$(cat out/reference_commit.txt)")
          fi
          commit_date=$(TZ=UTC git show -s --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd "$GITHUB_SHA")
          uv run --no-dev python -m piperobot.reports.history record --schema 2 --series "$SERIES" \
            --output out/record.json --results "$results" "${extra[@]}" --baseline-file "$BASELINE" \
            --commit "$GITHUB_SHA" --commit-date "$commit_date" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --platform "$(cat out/platform.txt)" --evaluated-at "$(cat out/evaluated_at.txt)" \
            --cpu-flags out/cpu_flags.txt --runner-image out/runner_image.txt
          echo "type=$(uv run --no-dev python -m piperobot.reports.history predicate-type --record out/record.json)" >> "$GITHUB_OUTPUT"
          {
            echo 'subjects<<EOF'
            printf '%s\n' "${subjects[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: verdict
        with:
          subject-path: ${{ steps.record.outputs.subjects }}
          predicate-type: ${{ steps.record.outputs.type }}
          predicate-path: out/record.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: provenance
        with:
          subject-path: |
            ${{ steps.record.outputs.subjects }}
            out/record.json
      - name: Copy verdict bundle
        env:
          BUNDLE: ${{ steps.verdict.outputs.bundle-path }}
        run: cp "$BUNDLE" out/bundle.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: history-certified
          path: |
            out/record.json
            out/results.json
            out/candidate.json
            out/reference.json
            out/bundle.jsonl
          retention-days: 7

  append:
    needs: attest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    # No concurrency group: it would cancel a pending run and drop a point; the script retries.
    env:
      SERIES: ${{ inputs.series }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --no-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: history-certified
          path: out/
      - name: Append evaluation to history
        env:
          HISTORY_REMOTE: https://github.com/${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$SERIES" in
            main) results=out/results.json; extra=() ;;
            nightly)
              results=out/candidate.json
              extra=(--attach "out/reference.json=results/$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.reference.json")
              ;;
            *) echo "ERROR: series must be main or nightly" >&2; exit 2 ;;
          esac
          bash .github/scripts/append_history.sh \
            --record out/record.json \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --attach "$results=results/$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.json" \
            "${extra[@]}" \
            --attach "out/bundle.jsonl=bundles/$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.jsonl"

  deploy:
    needs: append
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # As GitHub's Pages template: cancelling a deploy midway can break it.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: history
          path: history-data
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --no-dev
      - name: Render history page and publish raw data
        run: |
          uv run --no-dev python -m piperobot.reports.history render \
            --history history-data/history.json --output site/index.html --evidence-dir history-data
          cp history-data/history.json site/history.json
          for directory in results bundles; do
            if [ -d "history-data/$directory" ]; then
              cp -r "history-data/$directory" site/
            fi
          done
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
