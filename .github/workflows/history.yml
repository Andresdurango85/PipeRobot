name: history

# Evaluate main, append success-rate evidence to the history branch, and publish Pages (ADR 0026).
on:
  push:
    branches: [main]
    paths: ['piperobot/**', 'robots/pusht/**', 'uv.lock', '.github/workflows/history.yml',
            '.github/scripts/append_history.sh', '.github/workflows/certify.yml']
  workflow_dispatch:
permissions: {}

jobs:
  evaluate:
    runs-on: ubuntu-24.04 # pinned: its results are compared across runs (ci.md)
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      POLICY: robots/pusht/policies/vqbet.json
      BASELINE: robots/pusht/baselines/vqbet.json
      WORK_DIR: work/lerobot
      RESULTS: out/results.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install dependencies (from uv.lock, CPU-only torch)
        run: uv sync --locked --extra lerobot --group sim-pusht
      - name: Record platform and evaluation time
        run: |
          mkdir -p out
          uv run python -m piperobot.platform_info | tee out/platform.txt
          echo "Runner: $(cat out/platform.txt)" >> "$GITHUB_STEP_SUMMARY"
          awk '/^flags[[:space:]]*:/ {print; exit}' /proc/cpuinfo > out/cpu_flags.txt
          echo "$ImageOS $ImageVersion" > out/runner_image.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > out/evaluated_at.txt
      - name: Cache the prepared policy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WORK_DIR }}/policies
          key: policy-${{ hashFiles('robots/pusht/policies/vqbet.json', 'uv.lock', 'piperobot/adapters/lerobot/policy.py') }}
      - name: Evaluate policy (PushT, 50 fixed-seed episodes on CPU)
        run: |
          uv run python -m piperobot.adapters.lerobot.evaluate --policy "$POLICY" --work-dir "$WORK_DIR" \
            --output "$RESULTS"
      - name: Upload evaluation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: history-evaluation
          path: |
            out/results.json
            out/platform.txt
            out/evaluated_at.txt
            out/cpu_flags.txt
            out/runner_image.txt
          retention-days: 7

  # The caller grants the union; each job in certify.yml narrows it.
  certify:
    needs: evaluate
    if: github.ref == 'refs/heads/main'
    uses: $/.github/workflows/certify.yml
    with: {series: main, artifact: history-evaluation}
    permissions: {contents: write, id-token: write, attestations: write, pages: write}
