name: so101-gate

# Push-only trust boundary: only hosted reporting jobs hold write tokens.
# Every push produces so101-gate-verdict; the relevant-path list lives in
# .github/scripts/so101_gate.py.
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [gate, baseline]
        default: gate

permissions: {}
env:
  SEEDS: "100000-100099"
  BASELINE: robots/so101/baselines/scripted-pick-place
concurrency:
  group: so101-gate-${{ github.ref }}-${{ inputs.mode || 'gate' }}
  # Branches cancel superseded runs; main queues them, so a later docs-only merge never cancels
  # the post-merge evaluation of a gate-relevant one (ADR 0037).
  cancel-in-progress: ${{ inputs.mode != 'baseline' && github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
      dependabot: ${{ steps.detect.outputs.dependabot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: detect
        run: python3 .github/scripts/so101_gate.py changes
        env:
          BEFORE: ${{ github.event.before }}
          ACTOR: ${{ github.actor }}

  evaluate:
    needs: changes
    if: github.repository == 'Andresdurango85/PipeRobot' && github.actor != 'dependabot[bot]' && needs.changes.outputs.relevant == 'true' && needs.changes.outputs.dependabot != 'true'
    runs-on: [self-hosted, Windows, gpu]
    permissions:
      contents: read
    timeout-minutes: 130
    defaults:
      run:
        shell: powershell
    env:
      ISAACLAB_COMMIT: 44044b0963001962abe5701133427e37b003fffe
      # Records the owner's Omniverse EULA acceptance (ADR 0021).
      # Never create EULA_ACCEPTED by hand.
      OMNI_KIT_ACCEPT_EULA: "YES"
      PYTHONUNBUFFERED: "1"
      TASK: robots/so101/envs/vials_to_rack_task_randomized.json
      POLICY: robots/so101/policies/scripted_pick_place.json
      MAX_WORKERS: "2"
      # Peak VRAM of one scripted-policy Isaac worker (3379 MiB over idle) + 25%, rounded to 256.
      VRAM_PER_WORKER_MB: "4352"
      # Peak commit of one camera-off Isaac worker (6.6 GiB, PeakPageFileUsage) + 25%, rounded up to 256.
      COMMIT_PER_WORKER_MB: "8448"
    steps:
      - name: Start the clock
        run: |
          $ErrorActionPreference = 'Continue'
          "JOB_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" |
            Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          cache-local-path: ${{ runner.tool_cache }}/uv-cache
      - name: Paths
        run: |
          $ErrorActionPreference = 'Continue'
          $root = Join-Path $env:RUNNER_TOOL_CACHE 'isaaclab-3.0'
          $paths = [ordered]@{
            ISAAC_ROOT = $root
            ISAAC_SRC = "$root\IsaacLab"
            ISAAC_VENV = "$root\venv"
            ISAAC_PY = "$root\venv\Scripts\python.exe"
            PIPEROBOT_CACHE = "$env:RUNNER_TOOL_CACHE\piperobot-cache"
            WORK = "$env:RUNNER_TEMP\so101"
            OUT = "$env:GITHUB_WORKSPACE\out"
          }
          foreach ($entry in $paths.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" |
              Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }
          New-Item -ItemType Directory -Force -Path $paths.OUT, $paths.WORK -ErrorAction Stop | Out-Null
      - name: Isaac Lab at the pinned commit
        run: |
          $ErrorActionPreference = 'Continue'
          $head = ''
          if (Test-Path "$env:ISAAC_SRC\.git") {
            $head = git -C $env:ISAAC_SRC rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read Isaac Lab HEAD' }
          }
          $reuse = (Test-Path $env:ISAAC_PY) -and $head -eq $env:ISAACLAB_COMMIT
          if ($head -ne $env:ISAACLAB_COMMIT) {
            # Remove only the fixed source directory inside the runner-owned tool cache.
            $expected = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TOOL_CACHE 'isaaclab-3.0\IsaacLab'))
            if ([IO.Path]::GetFullPath($env:ISAAC_SRC) -ne $expected) { throw 'Unsafe source path' }
            if (Test-Path $expected) { Remove-Item -LiteralPath $expected -Recurse -Force -ErrorAction Stop }
            New-Item -ItemType Directory -Force -Path $expected -ErrorAction Stop | Out-Null
            git -C $env:ISAAC_SRC init
            if ($LASTEXITCODE -ne 0) { throw 'git init failed' }
            git -C $env:ISAAC_SRC remote add origin https://github.com/isaac-sim/IsaacLab.git
            if ($LASTEXITCODE -ne 0) { throw 'git remote failed' }
            git -C $env:ISAAC_SRC fetch --depth 1 origin $env:ISAACLAB_COMMIT
            if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
            git -C $env:ISAAC_SRC checkout --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'git checkout failed' }
          }
          $head = git -C $env:ISAAC_SRC rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:ISAACLAB_COMMIT) { throw 'Wrong Isaac Lab commit' }

          if ($reuse) {
            Write-Host 'reusing Isaac Lab at the pinned commit'
          } else {
            Set-Location $env:ISAAC_SRC -ErrorAction Stop
            $env:UV_PROJECT_ENVIRONMENT = $env:ISAAC_VENV
            uv sync --locked --extra isaacsim
            if ($LASTEXITCODE -ne 0) { throw 'uv sync failed' }
          }
      - name: Course assets and datasets
        run: |
          $ErrorActionPreference = 'Continue'
          uv sync --locked --group so101-data
          if ($LASTEXITCODE -ne 0) { throw 'Course dependencies failed' }
          uv run --no-sync python robots/so101/tools/prepare_caches.py
          if ($LASTEXITCODE -ne 0) { throw 'Course cache preparation failed' }
      - name: GPU preflight
        run: |
          $ErrorActionPreference = 'Continue'
          $memory = @(nvidia-smi --query-gpu=memory.free,memory.total --format=csv,noheader,nounits)
          if ($LASTEXITCODE -ne 0) { throw 'nvidia-smi memory query failed' }
          $apps = nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv
          if ($LASTEXITCODE -ne 0) { throw 'nvidia-smi process query failed' }
          $freeCommit = [math]::Floor((Get-CimInstance Win32_OperatingSystem -ErrorAction Stop).FreeVirtualMemory / 1024)
          @('GPU free/total MiB:', $memory, "Free commit MiB: $freeCommit", 'Compute processes:', $apps) |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $free = [int](($memory[0] -split ',')[0].Trim())
          $workers = 0
          for ($n = [int]$env:MAX_WORKERS; $n -ge 1; $n--) {
            if (($free -ge ($n * [int]$env:VRAM_PER_WORKER_MB)) -and
                ($freeCommit -ge ($n * [int]$env:COMMIT_PER_WORKER_MB))) {
              $workers = $n
              break
            }
          }
          $target = if ($workers -eq 0) { 1 } else { [int]$env:MAX_WORKERS }
          $shortVram = $free -lt ($target * [int]$env:VRAM_PER_WORKER_MB)
          $shortCommit = $freeCommit -lt ($target * [int]$env:COMMIT_PER_WORKER_MB)
          $resource = if ($shortVram -and $shortCommit) { 'VRAM and commit' }
                      elseif ($shortVram) { 'VRAM' }
                      else { 'commit (host memory)' }
          if ($workers -eq 0) {
            Write-Host "::error::not enough free $resource for 1 worker; the gate needs $env:VRAM_PER_WORKER_MB MiB VRAM and $env:COMMIT_PER_WORKER_MB MiB commit free per worker"
            exit 1
          }
          if ($workers -lt [int]$env:MAX_WORKERS) {
            Write-Host "::warning::running $workers worker(s), not enough free $resource for $($env:MAX_WORKERS): ~50 min at the baseline rate, longer if episodes fail"
          }
          "WORKERS=$workers" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "Workers: $workers" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - name: Evaluate (scripted policy, 100 seeds, one Isaac process per seed)
        # Sized for 100 failed seeds on 1 worker (~95 min: a failure runs the full horizon, ~2x a
        # success, plus retries), so a timeout never stands in for a BLOCK (ADR 0036).
        timeout-minutes: 120
        run: |
          $ErrorActionPreference = 'Continue'
          $watch = [Diagnostics.Stopwatch]::StartNew()
          uv run --no-sync python -m piperobot.adapters.isaaclab.evaluate `
            --task $env:TASK --policy $env:POLICY --seeds $env:SEEDS --workers $env:WORKERS `
            --isaac-python $env:ISAAC_PY --workdir $env:WORK `
            --output "$env:OUT\results.json" --device cuda:0
          $code = $LASTEXITCODE
          $watch.Stop()
          "Evaluation seconds: $($watch.Elapsed.TotalSeconds)" |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $total = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [int64]$env:JOB_START
          "Phase 0 elapsed seconds: $total; budget exceeded: $($total -gt 1800)" |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($total -gt 1800) { Write-Host '::warning::30-min Phase 0 budget exceeded' }
          if ($code -eq 2) { Write-Host '::error::evaluator error (not a policy failure)' }
          if ($code -ne 0) { exit $code }
      - name: Run information
        env:
          MODE: ${{ inputs.mode || 'gate' }}
        run: |
          $ErrorActionPreference = 'Continue'
          $gpu = nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
          if ($LASTEXITCODE -ne 0) { throw 'nvidia-smi failed' }
          @("Runner: $env:RUNNER_NAME", "GPU name, driver, total VRAM: $gpu",
            "Isaac Lab: $env:ISAACLAB_COMMIT", "Mode: $env:MODE", "Seeds: $env:SEEDS",
            "Workers: $env:WORKERS", "Commit: $env:GITHUB_SHA") | Out-File -Encoding utf8 "$env:OUT\runner.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: so101-gate
          path: |
            out/results.json
            out/run_metadata.json
            out/episodes_detail.json
            out/runner.txt
          if-no-files-found: error
          retention-days: 30

  report:
    needs: evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: so101-gate
          path: out/
      - name: Verdict and PR comments
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'gate' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          NOTE: "Privileged-state scripted policy: measures the simulated pipeline and regressions, not a deployable policy (ADR 0034)."
        run: |
          if [[ "$MODE" == baseline ]]; then
            mkdir -p out/baseline
            cp out/results.json "out/baseline/$(basename "$BASELINE")-episodes.json"
            uv run --no-sync python -m piperobot.adapters.isaaclab.baseline record \
              --results out/results.json --metadata out/run_metadata.json \
              --seeds "$SEEDS" --run-url "$RUN_URL" --output "out/baseline/$(basename "$BASELINE").json"
            for file in "out/baseline/$(basename "$BASELINE")-episodes.json" "out/baseline/$(basename "$BASELINE").json"; do
              echo "$file" >> "$GITHUB_STEP_SUMMARY"
              head -n 12 "$file" >> "$GITHUB_STEP_SUMMARY"
            done
            exit 0
          fi
          if [[ ! -f "$BASELINE-episodes.json" || ! -f "$BASELINE.json" ]]; then
            main_has_baseline=false
            for file in "$BASELINE.json" "$BASELINE-episodes.json"; do
              if gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=main" --silent 2> out/baseline-api-error.txt; then
                main_has_baseline=true
              elif ! grep -Eq 'HTTP 404([^0-9]|$)' out/baseline-api-error.txt; then
                cat out/baseline-api-error.txt >&2
                echo '::error::could not check main for a baseline'
                exit 1
              fi
            done
            if [[ "$main_has_baseline" == true ]]; then
              echo 'baseline exists on main but is missing here; no verdict' >> "$GITHUB_STEP_SUMMARY"
              echo '::error::the SO-101 baseline exists on main but is missing here; restore it (no verdict)'
              exit 1
            fi
            echo 'no baseline committed yet; nothing to compare' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          platform_code=0
          uv run --no-sync python -m piperobot.adapters.isaaclab.baseline check \
            --baseline "$BASELINE.json" \
            --metadata out/run_metadata.json 2> out/platform-check.txt || platform_code=$?
          if [[ "$platform_code" -eq 3 ]]; then
            cat out/platform-check.txt >> "$GITHUB_STEP_SUMMARY"
            echo '::error::baseline platform mismatch: re-measure the baseline (no verdict)'
            exit 1
          fi
          if [[ "$platform_code" -ne 0 ]]; then
            cat out/platform-check.txt >&2
            exit "$platform_code"
          fi
          code=0
          uv run python -m piperobot.reports.paired_comment \
            --reference "$BASELINE-episodes.json" \
            --candidate out/results.json --marker '<!-- piperobot-gate:so101 -->' \
            --title 'SO-101 gate (tube to rack, Isaac Lab)' --note "$NOTE" \
            --run-url "$RUN_URL" --commit "$GITHUB_SHA" --output out/comment.md || code=$?
          if [[ "$code" -gt 1 ]]; then exit "$code"; fi
          cat out/comment.md >> "$GITHUB_STEP_SUMMARY"
          prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[] | select(.state == "open") | .number')
          for pr in $prs; do
            uv run python -m piperobot.reports.sticky_comment --pr "$pr" \
              --body-file out/comment.md --marker '<!-- piperobot-gate:so101 -->'
          done
          if [[ "$code" -eq 1 ]]; then
            echo '::error::SO-101 paired gate: BLOCK'
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'baseline'
        with:
          name: so101-baseline
          path: out/baseline/
          if-no-files-found: error
          retention-days: 30

  video-select:
    needs: [changes, evaluate]
    if: >-
      github.repository == 'Andresdurango85/PipeRobot' &&
      github.actor != 'dependabot[bot]' &&
      needs.changes.outputs.relevant == 'true' &&
      needs.changes.outputs.dependabot != 'true' &&
      needs.evaluate.result == 'success' &&
      (github.event_name == 'push' || inputs.mode == 'gate') &&
      github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      seed_list: ${{ steps.selection.outputs.seed_list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: so101-gate
          path: out/
      - name: Select video seeds
        run: |
          reference=()
          if [[ -f "$BASELINE-episodes.json" ]]; then
            reference=(--reference "$BASELINE-episodes.json")
          fi
          uv run --no-sync python -m piperobot.reports.video_seeds "${reference[@]}" \
            --candidate out/results.json --output out/video-selection.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: so101-video-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/video-selection.json
          if-no-files-found: error
          retention-days: 1
      - name: Publish validated seed list
        id: selection
        run: |
          seeds=$(uv run --no-sync python -c \
            'import json; print(json.load(open("out/video-selection.json"))["seed_list"])')
          if [[ -n "$seeds" && ! "$seeds" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
            echo '::error::invalid video seed list'
            exit 1
          fi
          echo "seed_list=$seeds" >> "$GITHUB_OUTPUT"


  video:
    needs: [changes, evaluate, video-select]
    if: >-
      github.repository == 'Andresdurango85/PipeRobot' &&
      github.actor != 'dependabot[bot]' &&
      needs.changes.outputs.relevant == 'true' &&
      needs.changes.outputs.dependabot != 'true' &&
      needs.evaluate.result == 'success' &&
      needs.video-select.result == 'success' && needs.video-select.outputs.seed_list != '' &&
      (github.event_name == 'push' || inputs.mode == 'gate') &&
      github.ref != 'refs/heads/main'
    runs-on: [self-hosted, Windows, gpu]
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    env:
      ISAACLAB_COMMIT: 44044b0963001962abe5701133427e37b003fffe
      OMNI_KIT_ACCEPT_EULA: "YES"
      PYTHONUNBUFFERED: "1"
      TASK: robots/so101/envs/vials_to_rack_task_randomized.json
      POLICY: robots/so101/policies/scripted_pick_place.json
      # 19 GiB: the camera worker's cold commit peak (14.9 GiB) + 25%, rounded up
      COMMIT_FOR_VIDEO_MB: "19456"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          cache-local-path: ${{ runner.tool_cache }}/uv-cache
      - name: Paths
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TOOL_CACHE 'isaaclab-3.0'
          $paths = [ordered]@{
            ISAAC_SRC = "$root\IsaacLab"
            ISAAC_PY = "$root\venv\Scripts\python.exe"
            PIPEROBOT_CACHE = "$env:RUNNER_TOOL_CACHE\piperobot-cache"
            WORK = "$env:RUNNER_TEMP\so101-video"
            OUT = "$env:GITHUB_WORKSPACE\out"
          }
          foreach ($entry in $paths.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" |
              Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }
          New-Item -ItemType Directory -Force -Path $paths.OUT, $paths.WORK | Out-Null
      - run: uv sync --locked --group so101-data
      - name: Recording environment guard
        id: guard
        run: |
          $ErrorActionPreference = 'Continue'
          $head = ''
          if (Test-Path "$env:ISAAC_SRC\.git") {
            $head = git -C $env:ISAAC_SRC rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { $head = '' }
          }
          $ready = (Test-Path $env:ISAAC_PY) -and $head -eq $env:ISAACLAB_COMMIT
          "ready=$($ready.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $ready) { Write-Host '::warning::recording environment missing or unpinned' }
          exit 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: so101-gate
          path: out/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: so101-video-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
      - name: Memory preflight
        id: memory
        if: steps.guard.outputs.ready == 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $free = [math]::Floor((Get-CimInstance Win32_OperatingSystem).FreeVirtualMemory / 1024)
          $needed = [int]$env:COMMIT_FOR_VIDEO_MB
          if ($free -lt $needed) {
            Write-Host ("::warning::not enough host memory to record videos " +
              "(free commit $free MiB, needs $needed MiB)")
            @{ free_mib = $free; needed_mib = $needed } | ConvertTo-Json |
              Out-File -Encoding utf8 out/video-skip.json
          } else {
            'ready=true' >> $env:GITHUB_OUTPUT
          }
      - name: Record judged seeds
        if: steps.guard.outputs.ready == 'true' && steps.memory.outputs.ready == 'true'
        env:
          SEEDS_TO_RECORD: ${{ needs.video-select.outputs.seed_list }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SEEDS_TO_RECORD -notmatch '^[0-9]+(,[0-9]+)*$') {
            throw 'Invalid video seed list'
          }
          uv run --no-sync python -m piperobot.adapters.isaaclab.evaluate `
            --task $env:TASK --policy $env:POLICY --seeds $env:SEEDS_TO_RECORD --workers 1 `
            --isaac-python $env:ISAAC_PY --workdir $env:WORK `
            --output out\video\results.json --device cuda:0 --record-dir out\video\frames
      - name: Verify recorded episodes
        id: verify
        if: steps.memory.outputs.ready == 'true'
        run: |
          uv run --no-sync python -m piperobot.reports.video_manifest `
            --selection out/video-selection.json --judged out/episodes_detail.json `
            --recorded out/video/episodes_detail.json --frames-dir out/video/frames `
            --output out/manifest.json
      - name: Warn on incomplete recording
        if: failure()
        run: Write-Host '::warning::recording did not finish; the verdict is unaffected'
      - name: Upload verified frames and recording status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: so101-frames-${{ github.run_id }}-${{ github.run_attempt }}
          # Frames are uploaded only after manifest verification succeeds.
          path: |
            out/manifest.json
            out/video-skip.json
            ${{ steps.verify.outcome == 'success' && 'out/video/frames/' || '' }}
          if-no-files-found: ignore
          retention-days: 1

  video-report:
    needs: [changes, evaluate, report, video-select, video]
    if: >-
      always() && needs.evaluate.result == 'success' &&
      needs.video-select.result == 'success' &&
      (github.event_name == 'push' || inputs.mode == 'gate') &&
      github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      FRAMES: out/video/frames
      MP4_OUT: out/mp4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: so101-frames-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: so101-video-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
      - name: FFmpeg version
        if: needs.video-select.outputs.seed_list != ''
        run: |
          if command -v ffmpeg >/dev/null; then
            echo 'FFmpeg: preinstalled' >> "$GITHUB_STEP_SUMMARY"
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
            echo 'FFmpeg: installed with apt' >> "$GITHUB_STEP_SUMMARY"
          fi
          ffmpeg -version
      - name: Encode verified frames
        if: needs.video-select.outputs.seed_list != ''
        id: encode
        continue-on-error: true
        run: |
          mkdir -p "$MP4_OUT"
          shopt -s nullglob
          for dir in "$FRAMES"/*; do
            [[ -d "$dir" && -f "$dir/frame_0000.jpg" ]] || continue
            seed=$(basename "$dir")
            [[ "$seed" =~ ^[0-9]+$ ]] || continue
            ffmpeg -y -framerate 30 -i "$dir/frame_%04d.jpg" -c:v libx264 \
              -pix_fmt yuv420p -movflags +faststart "$MP4_OUT/$seed.mp4"
            stat --printf='%n: %s bytes\n' "$MP4_OUT/$seed.mp4" >> "$GITHUB_STEP_SUMMARY"
          done
          files=("$MP4_OUT"/*.mp4)
          if (( ${#files[@]} )); then echo 'has_videos=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: videos
        if: steps.encode.outputs.has_videos == 'true'
        with:
          name: so101-videos-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/mp4/
          retention-days: 7
      - name: Render video comment
        if: always()
        env:
          VIDEO_RESULT: ${{ needs.video.result }}
          COMMIT: ${{ github.sha }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.videos.outputs.artifact-url }}
        run: |
          mkdir -p out
          if [[ ! -f out/video-selection.json ]]; then
            printf '%s\n' '{"seeds": [], "reason": null}' > out/video-selection.json
            VIDEO_RESULT=failure
          fi
          args=()
          if [[ -f out/manifest.json ]]; then args+=(--manifest out/manifest.json); fi
          if [[ -f out/video-skip.json ]]; then
            memory=$(uv run --no-sync python -c '
          import json
          with open("out/video-skip.json", encoding="utf-8-sig") as source:
              memory = json.load(source)
          print(memory["free_mib"] / 1024, memory["needed_mib"] / 1024)
          ')
            read -r free needed <<< "$memory"
            args+=(--memory-skip-free-gib "$free" --memory-needed-gib "$needed")
          fi
          uv run --no-sync python -m piperobot.reports.video_section \
            --selection out/video-selection.json "${args[@]}" \
            --job-result "$VIDEO_RESULT" --artifact-url "$ARTIFACT_URL" \
            --commit "$COMMIT" --run-url "$RUN_URL" --output out/video-comment.md
          cat out/video-comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upsert video comment on open PRs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -f out/video-comment.md ]]; then
            echo '::warning::video comment could not be rendered'
            exit 0
          fi
          if ! prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '.[] | select(.state == "open") | .number'); then
            echo '::warning::could not find PRs for video comment'
            exit 0
          fi
          for pr in $prs; do
            uv run --no-sync python -m piperobot.reports.sticky_comment --pr "$pr" \
              --marker '<!-- piperobot-gate:so101-videos -->' \
              --body-file out/video-comment.md || echo '::warning::could not upsert video comment'
          done

  so101-gate-verdict:
    needs: [changes, evaluate, report]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - run: python3 .github/scripts/so101_gate.py verdict
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode || 'gate' }}
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          DEPENDABOT: ${{ needs.changes.outputs.dependabot }}
          EVALUATE: ${{ needs.evaluate.result }}
          REPORT: ${{ needs.report.result }}
