name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'
  pull_request:
    paths:
      - 'piperobot/stats/**'
      - 'tests/test_certificate.py'
      - 'tests/test_gate.py'
      - 'tests/test_gate_inputs.py'
      - 'tests/test_history.py'
      - 'tests/test_manual_eval.py'
      - 'tests/test_mock_eval.py'
      - 'tests/test_paired.py'
      - 'tests/test_paired_comment.py'
      - 'tests/test_pr_comment.py'
      - 'tests/test_stats_properties.py'
      - 'tests/conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/mutation.yml'
      - 'tests/mutation_equivalents.txt'
      - '.github/scripts/mutation_summary.py'

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-26.04 # PROBE (DO NOT MERGE)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group mutation

      - name: Run mutation tests
        run: uv run mutmut run

      - name: List survivors
        if: always()
        run: uv run mutmut results

      - name: Export statistics
        if: always()
        run: uv run mutmut export-cicd-stats

      - name: Summarize score and survivors
        if: always()
        run: uv run python .github/scripts/mutation_summary.py

      - name: Upload mutation statistics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-statistics
          path: mutants/mutmut-cicd-stats.json
          retention-days: 14
